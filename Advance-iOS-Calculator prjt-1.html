<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Professional Pro Calculator</title>
    <style>
        :root {
            --bg-color: #121212;
            --calc-bg: #000000;
            --btn-dark: #333333;
            --btn-light: #a5a5a5;
            --btn-orange: #ff9f0a;
            --btn-sci: #212123;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --side-bg: #1c1c1e;
        }

        /* Pure Solid Color Themes */
        body.theme-navy { --calc-bg: #0a192f; --btn-dark: #172a45; --btn-sci: #303c55; --btn-orange: #00b4d8; }
        body.theme-emerald { --calc-bg: #064e3b; --btn-dark: #047857; --btn-sci: #10b981; --btn-orange: #34d399; }
        body.theme-purple { --calc-bg: #2e1065; --btn-dark: #581c87; --btn-sci: #7e22ce; --btn-orange: #c084fc; }
        body.theme-red { --calc-bg: #450a0a; --btn-dark: #7f1d1d; --btn-sci: #991b1b; --btn-orange: #f87171; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
        }

        .app-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* Calculator Main Shell */
        .calculator-wrapper {
            background: var(--calc-bg);
            border-radius: 40px;
            padding: 24px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            width: 360px;
            transition: width 0.3s ease, background-color 0.3s;
        }

        .calculator-wrapper.scientific-mode {
            width: 720px;
        }

        /* Top Bar Controls */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 6px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-btn:hover { background: rgba(255, 255, 255, 0.3); }

        /* iPhone Bold Display Screen */
        .display-container {
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0 12px 12px 12px;
            margin-bottom: 10px;
        }

        .expression-screen {
            font-size: 16px;
            color: var(--text-sub);
            min-height: 20px;
            font-weight: 400;
        }

        .main-screen {
            font-size: 60px;
            font-weight: 500; /* iPhone-style Solid Crisp Numbers */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            letter-spacing: -1px;
            color: #ffffff;
        }

        /* Keypad Layout */
        .keypad-container {
            display: flex;
            gap: 14px;
        }

        .scientific-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            width: 360px;
            display: none;
        }

        .calculator-wrapper.scientific-mode .scientific-grid {
            display: grid;
        }

        .standard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
        }

        /* Buttons Styling */
        .btn {
            border: none;
            height: 64px;
            border-radius: 50%;
            font-size: 25px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.1s;
        }

        .btn:active { opacity: 0.7; }

        .btn-dark { background-color: var(--btn-dark); }
        .btn-light { background-color: var(--btn-light); color: #000000; font-weight: 600; }
        .btn-orange { background-color: var(--btn-orange); color: #ffffff; font-weight: 600; }
        .btn-sci { background-color: var(--btn-sci); font-size: 15px; }

        .btn-zero {
            grid-column: span 2;
            border-radius: 35px;
            justify-content: flex-start;
            padding-left: 26px;
        }

        /* Side Utility Panel */
        .side-panel {
            background: var(--side-bg);
            border-radius: 32px;
            padding: 20px;
            width: 340px;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-tabs {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            border-radius: 12px;
            font-weight: 500;
            font-size: 12px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .tab-content.active { display: flex; }

        /* History */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .clear-history-btn {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.4);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }

        .history-list {
            list-style: none;
            overflow-y: auto;
            max-height: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 12px;
            text-align: right;
            cursor: pointer;
        }

        .history-item .expr { font-size: 12px; color: var(--text-sub); }
        .history-item .res { font-size: 18px; color: var(--btn-orange); font-weight: 600; }

        /* Converters Styling */
        .converter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        .converter-group label {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .converter-input, select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 10px;
            border-radius: 10px;
            outline: none;
            font-size: 13px;
        }

        select option { background: #1c1c1e; color: #fff; }

        .converter-result {
            font-size: 18px;
            color: var(--btn-orange);
            font-weight: bold;
        }

        #imageInput, #colorInput { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Calculator Shell -->
        <div class="calculator-wrapper" id="calculator">
            
            <div class="top-bar">
                <button class="nav-btn" id="modeToggle">Scientific</button>
                <button class="nav-btn" onclick="document.getElementById('imageInput').click()">📷 Photo Theme</button>
                
                <select class="nav-btn" id="themeSelect" onchange="handleThemeChange(this.value)">
                    <option value="default">🖤 Solid Black</option>
                    <option value="navy">💙 Solid Navy</option>
                    <option value="emerald">💚 Solid Green</option>
                    <option value="purple">💜 Solid Purple</option>
                    <option value="red">🔴 Solid Red</option>
                    <option value="custom-color">🎨 Choose Custom Color</option>
                </select>

                <input type="file" id="imageInput" accept="image/*" onchange="setCustomPhotoTheme(event)">
                <input type="color" id="colorInput" onchange="applyCustomSolidColor(this.value)">
            </div>

            <!-- Screen -->
            <div class="display-container">
                <div class="expression-screen" id="expressionDisplay"></div>
                <div class="main-screen" id="mainDisplay">0</div>
            </div>

            <!-- Keypads Container -->
            <div class="keypad-container">
                
                <!-- Scientific Keypad -->
                <div class="scientific-grid">
                    <button class="btn btn-sci" onclick="calc.sciFunc('(')">(</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc(')')">)</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('mc')">mc</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('m+')">m+</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('m-')">m-</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('mr')">mr</button>

                    <button class="btn btn-sci" onclick="calc.sciFunc('pow2')">x²</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('pow3')">x³</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('sqrt')">²√x</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('cbrt')">³√x</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('pow10')">10ˣ</button>
                    <button class="btn btn-sci" id="degRadBtn" onclick="calc.toggleDegRad()">Rad</button>

                    <button class="btn btn-sci" onclick="calc.sciFunc('sin')">sin</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('cos')">cos</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('tan')">tan</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('ln')">ln</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('log10')">log₁₀</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('factorial')">x!</button>

                    <button class="btn btn-sci" onclick="calc.sciFunc('pi')">π</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('e')">e</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('rand')">Rand</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('sinh')">sinh</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('cosh')">cosh</button>
                    <button class="btn btn-sci" onclick="calc.sciFunc('tanh')">tanh</button>
                </div>

                <!-- Standard Keypad -->
                <div class="standard-grid">
                    <button class="btn btn-light" id="clearBtn" onclick="calc.clear()">AC</button>
                    <button class="btn btn-light" onclick="calc.backspace()">⌫</button>
                    <button class="btn btn-light" onclick="calc.inputPercent()">%</button>
                    <button class="btn btn-orange" onclick="calc.handleOperator('÷')">÷</button>

                    <button class="btn btn-dark" onclick="calc.inputDigit('7')">7</button>
                    <button class="btn btn-dark" onclick="calc.inputDigit('8')">8</button>
                    <button class="btn btn-dark" onclick="calc.inputDigit('9')">9</button>
                    <button class="btn btn-orange" onclick="calc.handleOperator('×')">×</button>

                    <button class="btn btn-dark" onclick="calc.inputDigit('4')">4</button>
                    <button class="btn btn-dark" onclick="calc.inputDigit('5')">5</button>
                    <button class="btn btn-dark" onclick="calc.inputDigit('6')">6</button>
                    <button class="btn btn-orange" onclick="calc.handleOperator('-')">−</button>

                    <button class="btn btn-dark" onclick="calc.inputDigit('1')">1</button>
                    <button class="btn btn-dark" onclick="calc.inputDigit('2')">2</button>
                    <button class="btn btn-dark" onclick="calc.inputDigit('3')">3</button>
                    <button class="btn btn-orange" onclick="calc.handleOperator('+')">+</button>

                    <button class="btn btn-dark btn-zero" onclick="calc.inputDigit('0')">0</button>
                    <button class="btn btn-dark" onclick="calc.inputDecimal()">.</button>
                    <button class="btn btn-orange" onclick="calc.calculateResult()">=</button>
                </div>

            </div>
        </div>

        <!-- Dashboard Side Panel -->
        <div class="side-panel">
            <div class="panel-tabs">
                <button class="tab-btn active" onclick="switchTab('historyTab', this)">History</button>
                <button class="tab-btn" onclick="switchTab('converterTab', this)">Converters & Tools</button>
            </div>

            <!-- Tab 1: History Log -->
            <div class="tab-content active" id="historyTab">
                <div class="history-header">
                    <span style="font-size:12px; color:var(--text-sub);">Calculations Log</span>
                    <button class="clear-history-btn" onclick="calc.clearHistory()">🗑 Clear History</button>
                </div>
                <ul class="history-list" id="historyList">
                    <li style="color:#8e8e93; font-size:12px; text-align:center; padding-top:20px;">No calculations yet</li>
                </ul>
            </div>

            <!-- Tab 2: All Converters -->
            <div class="tab-content" id="converterTab">
                <!-- Currency -->
                <div class="converter-group">
                    <label>Currency / Rupees Converter</label>
                    <input type="number" id="currAmount" class="converter-input" placeholder="Amount" oninput="convertCurrency()">
                    <select id="currFrom" onchange="convertCurrency()" style="margin-top:4px;">
                        <option value="USD">USD (\$)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="AED">AED (Dirham)</option>
                    </select>
                    <div class="converter-result" id="currencyResult" style="margin-top:4px;">₹ 0.00</div>
                </div>

                <!-- Comprehensive Multi-Unit Converter -->
                <div class="converter-group">
                    <label>Comprehensive Unit Converter</label>
                    <input type="number" id="unitVal" class="converter-input" placeholder="Value" oninput="convertUnits()">
                    <select id="unitType" onchange="convertUnits()" style="margin-top:4px;">
                        <option value="m_ft">Meters → Feet</option>
                        <option value="ft_m">Feet → Meters</option>
                        <option value="km_mile">KM → Miles</option>
                        <option value="cm_inch">Cm → Inches</option>
                        <option value="kg_lbs">Kg → Pounds (lbs)</option>
                        <option value="c_f">Celsius → Fahrenheit</option>
                    </select>
                    <div class="converter-result" id="unitResult" style="margin-top:4px;">0 Result</div>
                </div>

                <!-- BMI -->
                <div class="converter-group">
                    <label>BMI (Body Mass Index) Calculator</label>
                    <input type="number" id="bmiWeight" class="converter-input" placeholder="Weight (kg)" oninput="calcBMI()">
                    <input type="number" id="bmiHeight" class="converter-input" placeholder="Height (cm)" oninput="calcBMI()" style="margin-top:4px;">
                    <div class="converter-result" id="bmiResult" style="margin-top:4px;">BMI: --</div>
                </div>
            </div>

        </div>

    </div>

    <!-- Application Script -->
    <script>
        class IOSCalculator {
            constructor() {
                this.mainDisplay = document.getElementById('mainDisplay');
                this.expressionDisplay = document.getElementById('expressionDisplay');
                this.clearBtn = document.getElementById('clearBtn');
                this.calculatorEl = document.getElementById('calculator');
                this.historyList = document.getElementById('historyList');

                this.currentValue = '0';
                this.previousValue = null;
                this.operator = null;
                this.waitingForNewValue = false;
                this.history = [];
                this.isRad = true;

                this.initEventListeners();
            }

            initEventListeners() {
                document.getElementById('modeToggle').addEventListener('click', () => {
                    this.calculatorEl.classList.toggle('scientific-mode');
                });

                // Keyboard handling only when typing outside inputs
                window.addEventListener('keydown', (e) => {
                    if (document.activeElement.tagName === 'INPUT') return;
                    this.handleKeyboardInput(e);
                });
            }

            updateDisplay() {
                this.mainDisplay.innerText = this.currentValue;
                this.clearBtn.innerText = (this.currentValue !== '0' || this.previousValue !== null) ? 'C' : 'AC';
            }

            inputDigit(digit) {
                if (this.waitingForNewValue) {
                    this.currentValue = digit;
                    this.waitingForNewValue = false;
                } else {
                    this.currentValue = this.currentValue === '0' ? digit : this.currentValue + digit;
                }
                this.updateDisplay();
            }

            inputDecimal() {
                if (!this.currentValue.includes('.')) this.currentValue += '.';
                this.updateDisplay();
            }

            backspace() {
                if (this.currentValue.length > 1) {
                    this.currentValue = this.currentValue.slice(0, -1);
                } else {
                    this.currentValue = '0';
                }
                this.updateDisplay();
            }

            handleOperator(nextOperator) {
                const inputValue = parseFloat(this.currentValue);
                if (this.previousValue === null) {
                    this.previousValue = inputValue;
                } else if (this.operator) {
                    const result = this.compute(this.previousValue, inputValue, this.operator);
                    this.currentValue = String(result);
                    this.previousValue = result;
                }
                this.waitingForNewValue = true;
                this.operator = nextOperator;
                this.expressionDisplay.innerText = `${this.previousValue} ${this.operator}`;
                this.updateDisplay();
            }

            calculateResult() {
                if (!this.operator || this.previousValue === null) return;
                let inputValue = parseFloat(this.currentValue);
                let result = this.compute(this.previousValue, inputValue, this.operator);

                const exprStr = `${this.previousValue} ${this.operator} ${inputValue}`;
                this.addHistory(exprStr, result);

                this.expressionDisplay.innerText = `${exprStr} =`;
                this.currentValue = String(result);
                this.previousValue = null;
                this.operator = null;
                this.waitingForNewValue = true;
                this.updateDisplay();
            }

            compute(a, b, op) {
                switch (op) {
                    case '+': return a + b;
                    case '-': return a - b;
                    case '×': return a * b;
                    case '÷': return b === 0 ? 'Error' : a / b;
                    default: return b;
                }
            }

            clear() {
                this.currentValue = '0';
                this.previousValue = null;
                this.operator = null;
                this.expressionDisplay.innerText = '';
                this.updateDisplay();
            }

            inputPercent() {
                this.currentValue = String(parseFloat(this.currentValue) / 100);
                this.updateDisplay();
            }

            toggleDegRad() {
                this.isRad = !this.isRad;
                document.getElementById('degRadBtn').innerText = this.isRad ? 'Rad' : 'Deg';
            }

            sciFunc(action) {
                let val = parseFloat(this.currentValue);
                let radFactor = this.isRad ? 1 : (Math.PI / 180);

                switch (action) {
                    case 'pow2': this.currentValue = String(Math.pow(val, 2)); break;
                    case 'pow3': this.currentValue = String(Math.pow(val, 3)); break;
                    case 'sqrt': this.currentValue = String(Math.sqrt(val)); break;
                    case 'cbrt': this.currentValue = String(Math.cbrt(val)); break;
                    case 'pow10': this.currentValue = String(Math.pow(10, val)); break;
                    case 'sin': this.currentValue = String(Math.sin(val * radFactor)); break;
                    case 'cos': this.currentValue = String(Math.cos(val * radFactor)); break;
                    case 'tan': this.currentValue = String(Math.tan(val * radFactor)); break;
                    case 'ln': this.currentValue = String(Math.log(val)); break;
                    case 'log10': this.currentValue = String(Math.log10(val)); break;
                    case 'pi': this.currentValue = String(Math.PI); break;
                    case 'e': this.currentValue = String(Math.E); break;
                    case 'rand': this.currentValue = String(Math.random()); break;
                }
                this.waitingForNewValue = true;
                this.updateDisplay();
            }

            addHistory(expr, res) {
                this.history.unshift({ expr, res });
                this.renderHistory();
            }

            clearHistory() {
                this.history = [];
                this.renderHistory();
            }

            renderHistory() {
                if (this.history.length === 0) {
                    this.historyList.innerHTML = `<li style="color:#8e8e93; font-size:12px; text-align:center; padding-top:20px;">No calculations yet</li>`;
                    return;
                }
                this.historyList.innerHTML = this.history.map(item => `
                    <li class="history-item" onclick="calc.currentValue='${item.res}'; calc.updateDisplay();">
                        <div class="expr">${item.expr}</div>
                        <div class="res">${item.res}</div>
                    </li>
                `).join('');
            }

            handleKeyboardInput(e) {
                if (e.key >= '0' && e.key <= '9') this.inputDigit(e.key);
                if (e.key === '.') this.inputDecimal();
                if (e.key === 'Backspace') this.backspace();
                if (e.key === 'Enter' || e.key === '=') this.calculateResult();
                if (e.key === '+') this.handleOperator('+');
                if (e.key === '-') this.handleOperator('-');
                if (e.key === '*') this.handleOperator('×');
                if (e.key === '/') this.handleOperator('÷');
            }
        }

        const calc = new IOSCalculator();

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function handleThemeChange(val) {
            if (val === 'custom-color') {
                document.getElementById('colorInput').click();
            } else {
                document.body.className = '';
                document.body.style.backgroundImage = '';
                document.documentElement.style.removeProperty('--calc-bg');
                if (val !== 'default') {
                    document.body.classList.add(`theme-${val}`);
                }
            }
        }

        function applyCustomSolidColor(hexColor) {
            document.body.className = '';
            document.body.style.backgroundImage = '';
            document.documentElement.style.setProperty('--calc-bg', hexColor);
        }

        function setCustomPhotoTheme(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.className = '';
                    document.body.style.backgroundImage = `url('${e.target.result}')`;
                };
                reader.readAsDataURL(file);
            }
        }

        function convertCurrency() {
            const amt = parseFloat(document.getElementById('currAmount').value) || 0;
            const type = document.getElementById('currFrom').value;
            let rates = { 'USD': 83.5, 'EUR': 90.2, 'AED': 22.7 };
            let result = amt * rates[type];
            document.getElementById('currencyResult').innerText = `₹ ${result.toFixed(2)}`;
        }

        function convertUnits() {
            const val = parseFloat(document.getElementById('unitVal').value) || 0;
            const type = document.getElementById('unitType').value;
            let res = 0;
            let unitLabel = '';

            switch(type) {
                case 'm_ft': res = val * 3.28084; unitLabel = 'Feet'; break;
                case 'ft_m': res = val / 3.28084; unitLabel = 'Meters'; break;
                case 'km_mile': res = val * 0.621371; unitLabel = 'Miles'; break;
                case 'cm_inch': res = val * 0.393701; unitLabel = 'Inches'; break;
                case 'kg_lbs': res = val * 2.20462; unitLabel = 'Lbs'; break;
                case 'c_f': res = (val * 9/5) + 32; unitLabel = '°F'; break;
            }

            document.getElementById('unitResult').innerText = `${res.toFixed(2)} ${unitLabel}`;
        }

        function calcBMI() {
            const w = parseFloat(document.getElementById('bmiWeight').value);
            const h = parseFloat(document.getElementById('bmiHeight').value) / 100;
            if (w && h) {
                let bmi = (w / (h * h)).toFixed(1);
                let cat = bmi < 18.5 ? '(Underweight)' : bmi < 25 ? '(Normal)' : '(Overweight)';
                document.getElementById('bmiResult').innerText = `BMI: ${bmi} ${cat}`;
            }
        }
    </script>
</body>
</html>
